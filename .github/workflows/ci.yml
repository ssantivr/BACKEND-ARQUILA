name: CI

on:
  push:
    branches: [main, santiago]
  pull_request:

env:
  DATABASE_DIR: ${{ github.workspace }}/database

jobs:
  backend:
    name: Backend (lint and pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arquila_test
          POSTGRES_USER: arquila
          POSTGRES_PASSWORD: arquila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arquila -d arquila_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ssantivr/BASE-DE-DATOS-ARQUILA
          ref: santiago
          path: database
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check lint and formatting
        run: |
          ruff format --check app tests
          ruff check app tests
      - name: Run tests with SQLite
        run: pytest
      - name: Run tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://arquila:arquila@localhost:5432/arquila_test
        run: pytest
